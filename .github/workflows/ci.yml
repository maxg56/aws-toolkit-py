name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12","3.13","3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=aws_simple --cov-report=xml --cov-report=term --cov-fail-under=90

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Intentionally standalone: no other job needs this one, and this one
    # needs nothing, so a LocalStack hiccup can never block test, lint or
    # build.
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: 1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s

    env:
      AWS_ENDPOINT_URL: http://127.0.0.1:4566

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Wait for LocalStack S3 to be ready
      # Bounded wait. A container that never becomes healthy fails *this*
      # step with an explicit message, so flaky startup is never reported as
      # a test failure.
      run: |
        python - <<'EOF'
        import json
        import os
        import sys
        import time
        import urllib.request

        TIMEOUT_SECONDS = 120
        POLL_SECONDS = 2

        endpoint = os.environ["AWS_ENDPOINT_URL"].rstrip("/")
        health_url = f"{endpoint}/_localstack/health"
        deadline = time.monotonic() + TIMEOUT_SECONDS

        while True:
            try:
                with urllib.request.urlopen(health_url, timeout=5) as response:
                    status = json.load(response).get("services", {}).get("s3")
                if status in ("available", "running"):
                    print(f"LocalStack S3 is {status}")
                    sys.exit(0)
                reason = f"s3 status is {status!r}"
            except (OSError, ValueError) as exc:
                reason = f"{type(exc).__name__}: {exc}"

            if time.monotonic() >= deadline:
                sys.exit(
                    f"::error::LocalStack S3 was not ready at {endpoint} "
                    f"within {TIMEOUT_SECONDS}s ({reason})"
                )
            time.sleep(POLL_SECONDS)
        EOF

    - name: Run integration tests
      # AWS_SIMPLE_INTEGRATION_REQUIRED makes an unreachable endpoint a
      # failure rather than a skip, so this job cannot pass green by
      # silently skipping every test.
      env:
        AWS_SIMPLE_INTEGRATION_REQUIRED: "1"
      run: |
        pytest -m integration -v --no-cov

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Black formatter check
      run: |
        black --check src/ tests/

    - name: Run Ruff linter
      run: |
        ruff check src/

    - name: Run mypy type checker
      run: |
        mypy src/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Assert py.typed marker is shipped (PEP 561)
      run: |
        python - <<'EOF'
        import glob
        import sys
        import tarfile
        import zipfile

        missing = []

        wheels = glob.glob("dist/*.whl")
        if not wheels:
          sys.exit("No wheel found in dist/")
        for wheel in wheels:
          with zipfile.ZipFile(wheel) as zf:
              if "aws_simple/py.typed" not in zf.namelist():
                missing.append(wheel)

        (sdist,) = glob.glob("dist/*.tar.gz")
        with tarfile.open(sdist) as tf:
            if not any(n.endswith("/src/aws_simple/py.typed") for n in tf.getnames()):
                missing.append(sdist)

        if missing:
            sys.exit("py.typed marker missing from: " + ", ".join(missing))
        print("py.typed present in wheel and sdist")
        EOF

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 7
