name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12","3.13","3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=aws_simple --cov-report=xml --cov-report=term --cov-fail-under=90

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Black formatter check
      run: |
        black --check src/ tests/

    - name: Run Ruff linter
      run: |
        ruff check src/

    - name: Run mypy type checker
      run: |
        mypy src/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Assert py.typed marker is shipped (PEP 561)
      run: |
        python - <<'EOF'
        import glob
        import sys
        import tarfile
        import zipfile

        missing = []

        (wheel,) = glob.glob("dist/*.whl")
        with zipfile.ZipFile(wheel) as zf:
            if "aws_simple/py.typed" not in zf.namelist():
                missing.append(wheel)

        (sdist,) = glob.glob("dist/*.tar.gz")
        with tarfile.open(sdist) as tf:
            if not any(n.endswith("/src/aws_simple/py.typed") for n in tf.getnames()):
                missing.append(sdist)

        if missing:
            sys.exit("py.typed marker missing from: " + ", ".join(missing))
        print("py.typed present in wheel and sdist")
        EOF

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 7
